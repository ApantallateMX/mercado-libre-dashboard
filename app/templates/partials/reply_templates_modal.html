<!-- Modal compartido de Plantillas de respuesta — usado desde Mensajes ML y
     Mensajes de Compradores Amazon. Sirve para 2 cosas con el mismo modal:
     (1) insertar una plantilla en un textarea de respuesta específico
         (window.openTemplatesModal('ml', 'msg-input-123', accountId)), o
     (2) solo gestionar la lista (agregar/editar/borrar) sin insertar nada
         (window.openTemplatesModal('ml')) — el botón "Usar" se oculta.
     Cada plantilla puede estar atada a UNA cuenta específica o a "todas las
     cuentas" de esa plataforma — cada cuenta puede necesitar responder
     distinto (tono, políticas, marca). -->
<div id="templates-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[85vh] overflow-y-auto">
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white">
      <h3 class="font-semibold text-gray-800">📋 Plantillas de respuesta</h3>
      <button onclick="window.closeTemplatesModal()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="p-5">
      <div id="templates-list" class="space-y-2 mb-4">
        <p class="text-sm text-gray-400 text-center py-4">Cargando...</p>
      </div>

      <div class="border-t border-gray-100 pt-4">
        <button id="templates-new-btn" onclick="window.templatesToggleForm()" class="text-sm text-blue-600 hover:underline font-medium">
          + Nueva plantilla
        </button>
        <div id="templates-form" class="hidden mt-3 space-y-2">
          <input type="hidden" id="tpl-id">
          <input type="text" id="tpl-label" placeholder="Nombre (ej. Pregunta por garantía)"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
          <textarea id="tpl-body" rows="3" placeholder="Texto de la respuesta..."
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"></textarea>
          <select id="tpl-platform" onchange="window._tplOnPlatformChange()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white">
            <option value="all">Ambas plataformas (ML + Amazon)</option>
            <option value="ml">Solo Mercado Libre</option>
            <option value="amz">Solo Amazon</option>
          </select>
          <select id="tpl-account" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white">
            <option value="">Todas las cuentas</option>
          </select>
          <div class="flex gap-2">
            <button onclick="window.templatesSave()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">Guardar</button>
            <button onclick="window.templatesToggleForm()" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var _tplList = [];
var _tplTarget = null;   // id del textarea destino, o null si es solo gestión
var _tplPlatform = 'all';
var _tplAccountId = '';  // cuenta activa del hilo que se está respondiendo (si aplica)
var _tplAccounts = null; // cache: {ml: [{id,nickname}], amazon: [{id,nickname}]}

function _tplLoadAccounts(cb) {
    if (_tplAccounts) { cb(); return; }
    fetch('/api/reply-templates/accounts')
        .then(function(r) { return r.json(); })
        .then(function(d) { _tplAccounts = d; cb(); })
        .catch(function() { _tplAccounts = {ml: [], amazon: []}; cb(); });
}

function _tplAccountsForPlatform(platform) {
    if (!_tplAccounts) return [];
    if (platform === 'amz') return _tplAccounts.amazon || [];
    if (platform === 'ml') return _tplAccounts.ml || [];
    return [];
}

function _tplAccountLabel(t) {
    if (!t.account_id) return null;
    var list = _tplAccountsForPlatform(t.platform);
    var found = list.find(function(a) { return a.id === t.account_id; });
    return found ? found.nickname : t.account_id;
}

window._tplOnPlatformChange = function(selectedAccountId) {
    var platform = document.getElementById('tpl-platform').value;
    var sel = document.getElementById('tpl-account');
    var list = _tplAccountsForPlatform(platform);
    var scopeLabel = platform === 'ml' ? ' de Mercado Libre' : (platform === 'amz' ? ' de Amazon' : '');
    var html = '<option value="">Todas las cuentas' + scopeLabel + '</option>';
    list.forEach(function(a) {
        html += '<option value="' + a.id + '">Solo ' + a.nickname + '</option>';
    });
    sel.innerHTML = html;
    sel.disabled = (platform === 'all');
    sel.value = (platform !== 'all' && selectedAccountId) ? selectedAccountId : '';
};

window.openTemplatesModal = function(platform, targetTextareaId, accountId) {
    _tplPlatform = platform || 'all';
    _tplTarget = targetTextareaId || null;
    _tplAccountId = accountId || '';
    document.getElementById('templates-modal').classList.remove('hidden');
    document.getElementById('templates-form').classList.add('hidden');
    _tplLoadAccounts(function() { window.templatesLoad(); });
};

window.closeTemplatesModal = function() {
    document.getElementById('templates-modal').classList.add('hidden');
};

window.templatesToggleForm = function() {
    var form = document.getElementById('templates-form');
    var isHidden = form.classList.contains('hidden');
    form.classList.toggle('hidden');
    if (isHidden) {
        document.getElementById('tpl-id').value = '';
        document.getElementById('tpl-label').value = '';
        document.getElementById('tpl-body').value = '';
        var platform = _tplPlatform === 'amz' ? 'amz' : (_tplPlatform === 'ml' ? 'ml' : 'all');
        document.getElementById('tpl-platform').value = platform;
        // Al crear una plantilla nueva desde un hilo de una cuenta específica,
        // se pre-selecciona esa cuenta como conveniencia — sigue siendo editable.
        window._tplOnPlatformChange(_tplAccountId);
    }
};

window.templatesLoad = function() {
    var url = '/api/reply-templates?platform=' + encodeURIComponent(_tplPlatform);
    if (_tplAccountId) url += '&account_id=' + encodeURIComponent(_tplAccountId);
    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(d) {
            _tplList = d.templates || [];
            window.templatesRender();
        })
        .catch(function() {
            document.getElementById('templates-list').innerHTML = '<p class="text-sm text-red-500 text-center py-4">Error cargando plantillas</p>';
        });
};

window.templatesRender = function() {
    var el = document.getElementById('templates-list');
    if (!_tplList.length) {
        el.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">No hay plantillas todavía</p>';
        return;
    }
    var platformLabel = {ml: 'ML', amz: 'Amazon', all: 'Ambas'};
    el.innerHTML = _tplList.map(function(t) {
        var accountLabel = _tplAccountLabel(t);
        var scopeBadge = accountLabel
            ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700">' + accountLabel + '</span>'
            : '<span class="text-[10px] font-normal text-gray-400">(' + (platformLabel[t.platform] || t.platform) + ' — todas las cuentas)</span>';
        return '<div class="border border-gray-200 rounded-lg p-3">' +
            '<div class="flex items-start justify-between gap-2">' +
                '<div class="min-w-0">' +
                    '<p class="text-sm font-semibold text-gray-800 flex items-center gap-1.5 flex-wrap">' + t.label + ' ' + scopeBadge + '</p>' +
                    '<p class="text-xs text-gray-500 mt-0.5 line-clamp-2">' + t.body_text + '</p>' +
                '</div>' +
                '<div class="flex items-center gap-1 shrink-0">' +
                    (_tplTarget ? '<button onclick="window.templatesUse(' + t.id + ')" class="text-xs bg-blue-600 text-white px-2.5 py-1 rounded-lg hover:bg-blue-700 font-medium">Usar</button>' : '') +
                    '<button onclick="window.templatesEdit(' + t.id + ')" class="text-xs text-gray-400 hover:text-gray-700 px-1.5">✎</button>' +
                    '<button onclick="window.templatesDelete(' + t.id + ')" class="text-xs text-gray-400 hover:text-red-600 px-1.5">🗑</button>' +
                '</div>' +
            '</div>' +
        '</div>';
    }).join('');
};

window.templatesUse = function(id) {
    var t = _tplList.find(function(x) { return x.id === id; });
    if (!t || !_tplTarget) return;
    var ta = document.getElementById(_tplTarget);
    if (ta) ta.value = t.body_text;
    window.closeTemplatesModal();
};

window.templatesEdit = function(id) {
    var t = _tplList.find(function(x) { return x.id === id; });
    if (!t) return;
    document.getElementById('templates-form').classList.remove('hidden');
    document.getElementById('tpl-id').value = t.id;
    document.getElementById('tpl-label').value = t.label;
    document.getElementById('tpl-body').value = t.body_text;
    document.getElementById('tpl-platform').value = t.platform;
    window._tplOnPlatformChange(t.account_id || '');
};

window.templatesSave = function() {
    var id = document.getElementById('tpl-id').value;
    var label = document.getElementById('tpl-label').value.trim();
    var body_text = document.getElementById('tpl-body').value.trim();
    var platform = document.getElementById('tpl-platform').value;
    var account_id = document.getElementById('tpl-account').value;
    if (!label || !body_text) { alert('Nombre y texto son requeridos'); return; }
    var payload = {label: label, body_text: body_text, platform: platform, account_id: account_id};
    if (id) payload.id = parseInt(id, 10);
    fetch('/api/reply-templates', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    })
    .then(function(r) { return r.json(); })
    .then(function() {
        document.getElementById('templates-form').classList.add('hidden');
        window.templatesLoad();
    })
    .catch(function() { alert('Error al guardar'); });
};

window.templatesDelete = function(id) {
    if (!confirm('¿Eliminar esta plantilla?')) return;
    fetch('/api/reply-templates/' + id, {method: 'DELETE'})
        .then(function() { window.templatesLoad(); })
        .catch(function() { alert('Error al eliminar'); });
};

// Helper usado por los botones "📋 Plantillas" junto a cada textarea de
// respuesta (ML y Amazon) — abre el modal ya apuntando a ESE textarea y a la
// cuenta activa de ese hilo (accountId), para filtrar plantillas relevantes.
window.insertTemplateInto = function(textareaId, platform, accountId) {
    window.openTemplatesModal(platform, textareaId, accountId);
};
</script>
